[project]
name = "vocab-trainer"
version = "0.1.0"
description = "A command-line vocabulary trainer with spaced repetition."
readme = "README.md"
authors = [
    { name = "humarroquin", email = "149089365+humarroquin@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
vocab-trainer = "vocab_trainer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
